<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#101511" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="inq" />
    <title>inq</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        let preference = null;
        try {
          preference = localStorage.getItem("inq:theme-preference");
        } catch {
          // The CSS default remains dark when storage is unavailable.
        }
        const theme =
          preference === "light" ||
          (preference === "system" &&
            !window.matchMedia("(prefers-color-scheme: dark)").matches)
            ? "light"
            : "dark";
        document.documentElement.dataset.theme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", theme === "dark" ? "#101511" : "#fcfcfc");
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
